<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇门遁甲 - 天地盘动画演示</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #1a1410;
  font-family: "Microsoft YaHei","SimSun",serif;
  color: #d4c5a0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

/* ---------- header ---------- */
.header {
  text-align:center;
  padding: 18px 20px 10px;
}
.header h1 {
  font-size: 28px;
  letter-spacing: 4px;
  color: #f0d88a;
  text-shadow: 0 0 20px rgba(240,200,100,.4);
}
.header .sub {
  font-size: 13px;
  color: #8a7b60;
  margin-top: 4px;
}

/* ---------- main layout ---------- */
.main {
  display:flex;
  gap: 24px;
  align-items:flex-start;
  padding: 0 20px 30px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:1100px;
  width:100%;
}

/* ---------- grid panel ---------- */
.grid-panel {
  background: linear-gradient(145deg,#2a2218,#1e1810);
  border: 2px solid #5a4a30;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 0 30px rgba(120,100,60,.15);
}

.grid-title {
  text-align:center;
  font-size: 14px;
  color: #b8a070;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.grid-container {
  display:grid;
  grid-template-columns: repeat(3, 120px);
  grid-template-rows: repeat(3, 120px);
  gap: 4px;
}

/* Luoshu order: row0=[4,9,2] row1=[3,5,7] row2=[8,1,6] */
.cell {
  background: #2a2018;
  border: 1.5px solid #4a3d28;
  border-radius: 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  transition: all .4s;
  cursor:default;
  font-size:13px;
  gap: 2px;
}

.cell.highlight-earth { border-color:#c8960c; box-shadow:inset 0 0 14px rgba(200,150,12,.25); }
.cell.highlight-heaven { border-color:#4a90d9; box-shadow:inset 0 0 14px rgba(74,144,217,.25); }
.cell.highlight-god   { border-color:#c060a0; box-shadow:inset 0 0 14px rgba(192,96,160,.25); }
.cell.flash {
  animation: flashCell .6s ease-out;
}
@keyframes flashCell {
  0% { box-shadow:inset 0 0 30px rgba(240,200,100,.7); }
  100% { box-shadow:inset 0 0 0px rgba(240,200,100,0); }
}

.cell-num {
  position:absolute;
  top:4px; left:7px;
  font-size:11px;
  color:#5a4a30;
  font-weight:bold;
}

/* Layers inside cell */
.cell-layer {
  width:100%;
  text-align:center;
  line-height:1.3;
}

/* earth stems */
.earth-stem {
  font-size: 18px;
  font-weight: bold;
  color: #c8960c;
  letter-spacing: 2px;
}

/* heaven stems */
.heaven-stem {
  font-size: 18px;
  font-weight: bold;
  color: #4a90d9;
  letter-spacing: 2px;
}

/* door */
.door-text {
  font-size: 13px;
  color: #9a8a6a;
}

/* star */
.star-text {
  font-size: 11px;
  color: #6a9ab0;
  white-space: nowrap;
}

/* god */
.god-text {
  font-size: 10px;
  color: #c080a0;
  white-space: nowrap;
}

.cell-divider {
  width: 70%;
  height: 1px;
  background: #3a2d18;
  margin: 2px 0;
}

/* center cell (5) */
.cell.center-cell {
  background: #1e1810;
  border-color: #5a4a30;
}

/* ---------- control panel ---------- */
.control-panel {
  background: linear-gradient(145deg,#2a2218,#1e1810);
  border: 2px solid #5a4a30;
  border-radius: 14px;
  padding: 20px;
  width: 280px;
  box-shadow: 0 0 30px rgba(120,100,60,.15);
}

.control-panel h3 {
  text-align:center;
  color: #f0d88a;
  font-size: 16px;
  margin-bottom: 14px;
  letter-spacing: 2px;
}

.info-row {
  display:flex;
  justify-content:space-between;
  padding: 6px 0;
  border-bottom: 1px solid #2a1e10;
  font-size:13px;
}
.info-row .label { color:#8a7b60; }
.info-row .value { color:#d4c5a0; font-weight:bold; }

/* buttons */
.btn-group {
  display:flex;
  flex-wrap:wrap;
  gap: 8px;
  margin: 14px 0;
}
.btn {
  flex:1;
  min-width:70px;
  padding: 8px 6px;
  border: 1px solid #5a4a30;
  background: #2a2018;
  color: #d4c5a0;
  border-radius: 6px;
  cursor:pointer;
  font-size:13px;
  transition: all .2s;
  text-align:center;
  font-family:inherit;
}
.btn:hover { background:#3a2d20; border-color:#8a7a50; }
.btn.active { background:#5a3a10; border-color:#c8960c; color:#f0d88a; }
.btn.play-btn { background:#3a2a10; border-color:#c8960c; color:#f0d88a; }
.btn.play-btn:hover { background:#5a3a10; }

.speed-row {
  display:flex;
  align-items:center;
  gap:8px;
  margin: 10px 0;
  font-size:12px;
  color:#8a7b60;
}
.speed-row input { flex:1; accent-color:#c8960c; }

/* layer toggles */
.layer-toggles {
  margin: 10px 0;
}
.toggle-row {
  display:flex;
  align-items:center;
  gap:6px;
  padding: 4px 0;
  font-size:12px;
  cursor:pointer;
}
.toggle-dot {
  width:12px;height:12px;border-radius:50%;display:inline-block;
}
.toggle-row.on .toggle-dot { opacity:1; }
.toggle-row:not(.on) .toggle-dot { opacity:.3; }

/* ---------- legend ---------- */
.legend {
  background: linear-gradient(145deg,#2a2218,#1e1810);
  border: 1.5px solid #5a4a30;
  border-radius: 12px;
  padding: 16px;
  width: 280px;
  box-shadow: 0 0 30px rgba(120,100,60,.15);
}
.legend h3 {
  text-align:center;
  color: #f0d88a;
  font-size: 14px;
  margin-bottom: 10px;
  letter-spacing:2px;
}
.legend-item {
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 0;
  font-size:12px;
}
.legend-dot {
  width:10px;height:10px;border-radius:2px;display:inline-block;
}

/* ---------- progress bar ---------- */
.progress-wrap {
  width:100%;max-width:820px;
  margin: 0 auto 16px;
}
.progress-bar {
  width:100%;height:6px;
  background:#2a1e10;
  border-radius:3px;
  overflow:hidden;
}
.progress-fill {
  height:100%;
  background: linear-gradient(90deg,#c8960c,#f0d88a);
  border-radius:3px;
  transition: width .5s;
}
.progress-labels {
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#5a4a30;
  margin-top:4px;
}

/* ---------- phrase hint ---------- */
.phrase-hint {
  text-align:center;
  font-size: 14px;
  color: #b8a070;
  padding: 6px;
  min-height: 30px;
  letter-spacing: 1px;
}
.phrase-hint strong { color:#f0d88a; }

/* responsive */
@media (max-width:900px) {
  .grid-container {
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
  }
  .cell { font-size:11px; }
  .earth-stem,.heaven-stem { font-size:15px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🏯 奇门遁甲 · 天地盘动画演示</h1>
  <div class="sub">黄道盘（地盘）↔ 赤道盘（天盘）· 荀爽「覆盘」思想</div>
</div>

<!-- progress -->
<div class="progress-wrap" style="padding:0 20px;">
  <div class="phrase-hint" id="phraseHint"><strong>初始状态</strong> — 阳遁4局 · 芒种上元</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-labels" id="progressLabels"></div>
</div>

<!-- main -->
<div class="main">
  <!-- grid -->
  <div class="grid-panel">
    <div class="grid-title">九 宫 · 洛 书</div>
    <div class="grid-container" id="gridContainer"></div>
  </div>

  <!-- controls -->
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="control-panel">
      <h3>⚙️ 控制面板</h3>
      <div class="info-row"><span class="label">阴阳遁</span><span class="value" id="infoDun">阳遁</span></div>
      <div class="info-row"><span class="label">局数</span><span class="value" id="infoBureau">4</span></div>
      <div class="info-row"><span class="label">节气</span><span class="value" id="infoJieqi">芒种上元</span></div>
      <div class="info-row"><span class="label">当前时辰</span><span class="value" id="infoShichen">—</span></div>
      <div class="info-row"><span class="label">旬首/值符</span><span class="value" id="infoXunshou">—</span></div>
      <div class="info-row"><span class="label">值符落宫</span><span class="value" id="infoZhiFu">—</span></div>

      <div class="btn-group">
        <button class="btn" onclick="stepPrev()" title="上一步">◀ 上一步</button>
        <button class="btn play-btn" id="btnPlay" onclick="togglePlay()">▶ 播放</button>
        <button class="btn" onclick="stepNext()" title="下一步">下一步 ▶</button>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="resetAll()">↺ 重置</button>
        <button class="btn" onclick="jumpTo(0)">⏮ 伏吟</button>
      </div>
      <div class="speed-row">
        <span>速度</span>
        <input type="range" id="speedSlider" min="1" max="10" value="5" oninput="updateSpeed()">
        <span id="speedLabel">5</span>
      </div>
    </div>

    <!-- legend -->
    <div class="legend">
      <h3>📖 图例</h3>
      <div class="legend-item"><span class="legend-dot" style="background:#c8960c"></span> 地盘干 — 黄道盘（年/公转·固定）</div>
      <div class="legend-item"><span class="legend-dot" style="background:#4a90d9"></span> 天盘干 — 赤道盘（日/自转·每时辰变）</div>
      <div class="legend-item"><span class="legend-dot" style="background:#9a8a6a"></span> 八门 — 随地盘干（人事方位）</div>
      <div class="legend-item"><span class="legend-dot" style="background:#6a9ab0"></span> 九星 — 随天盘干来源宫（天象）</div>
      <div class="legend-item"><span class="legend-dot" style="background:#c080a0"></span> 八神 — 随天盘值符宫（神煞）</div>
    </div>
  </div>
</div>

<script>
// ==================== QIMEN ENGINE (JS) ====================

const TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DIZHI   = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// Palace label mapping
const PALACE_LABEL = {1:'坎',2:'坤',3:'震',4:'巽',5:'中',6:'乾',7:'兑',8:'艮',9:'离'};

// Fixed door per stem (follows earth plate)
const STEM_DOOR = {'戊':'伤门','己':'杜门','庚':'','辛':'开门','壬':'惊门','癸':'生门','丁':'景门','丙':'休门','乙':'死门'};

// Fixed star per palace
const PALACE_STAR = {1:'天蓬',2:'天芮',3:'天冲',4:'天辅',5:'天禽',6:'天心',7:'天柱',8:'天任',9:'天英'};

// Gods order
const GODS_YANG = ['值符','腾蛇','太阴','六合','白虎','玄武','九地','九天'];
const GODS_YIN  = ['值符','腾蛇','九地','六合','九天','太阴','玄武','白虎'];

// Xun head stem
const XUNHEAD_GAN = {0:'戊',10:'己',20:'庚',30:'辛',40:'壬',50:'癸'};

function jiaziPos(gz) {
  const g = TIANGAN.indexOf(gz[0]);
  const z = DIZHI.indexOf(gz[1]);
  let idx = -1;
  for(let i=0;i<60;i++){
    if(i%10===g && i%12===z){idx=i;break;}
  }
  return idx;
}

function getXunShouGan(hourGz) {
  const pos = jiaziPos(hourGz);
  return XUNHEAD_GAN[Math.floor(pos/10)*10] || '戊';
}

// Earth plate: from bureau, yin/yang dun
function getDiPan(dun, bureau) {
  const seq = ['戊','己','庚','辛','壬','癸','丁','丙','乙'];
  const dp = {};
  for(let i=0;i<9;i++) {
    let pos;
    if(dun==='阳') pos = (bureau-1 + i) % 9 + 1;
    else pos = (bureau-1 - i + 9) % 9 + 1;
    dp[pos] = seq[i];
  }
  return dp;
}

// Heaven plate
function getHeavenPlate(diPan, dun, zhiFuPos, hourGanPos) {
  const fly9 = dun==='阳'
    ? [1,2,3,4,6,7,8,9,5]
    : [9,8,7,6,4,3,2,1,5];
  const zfI = fly9.indexOf(zhiFuPos);
  const tgI = fly9.indexOf(hourGanPos);
  const offset = (tgI - zfI + 9) % 9;
  const hv = {};
  for(let p=1;p<=9;p++) {
    const pi = fly9.indexOf(p);
    const orgI = (pi - offset + 9) % 9;
    hv[p] = diPan[fly9[orgI]] || '';
  }
  return hv;
}

// Stars: follow heaven stem's source palace
function getStars(heavenPlate, diPan) {
  const stars = {};
  for(let p=1;p<=9;p++) {
    const g = heavenPlate[p];
    let src = 5;
    for(let k=1;k<=9;k++) { if(diPan[k]===g){src=k;break;} }
    stars[p] = PALACE_STAR[src] || '';
  }
  return stars;
}

// Gods: from heaven zhi fu palace
function getGods(dun, heavenZfPos) {
  const gods = {};
  let fly8, deities;
  if(dun==='阳') {
    fly8 = [1,2,3,4,6,7,8,9];
    deities = GODS_YANG;
  } else {
    fly8 = [4,3,2,1,9,8,7,6];
    deities = GODS_YIN;
  }
  let startP = (heavenZfPos===5) ? 2 : heavenZfPos;
  const si = fly8.indexOf(startP);
  for(let i=0;i<8;i++) {
    const pp = fly8[(si+i)%8];
    gods[pp] = deities[i];
  }
  gods[5] = gods[startP];
  return gods;
}

// ==================== STATE ====================

const DUN = '阳';
const BUREAU = 4;
const JIEQI = '芒种上元';

// 12 时辰 for demo (甲午旬 demo: 甲午、乙未、丙申、丁酉、戊戌、己亥、庚子、辛丑、壬寅、癸卯、甲辰、乙巳)
// Let's use actual 甲午旬时辰 (甲午旬 covers 30-39 in 60 jiazi)
const SHICHEN_LIST = [
  '甲午','乙未','丙申','丁酉','戊戌','己亥',
  '庚子','辛丑','壬寅','癸卯','甲辰','乙巳'
];

const diPan = getDiPan(DUN, BUREAU);
// Yang 4: 
// pos: 4:戊,5:己,6:庚,7:辛,8:壬,9:癸,1:丁,2:丙,3:乙

let currentIndex = 0;
let isPlaying = false;
let playTimer = null;
let speed = 5; // 1-10

// ==================== RENDER ====================

function computeAll(shichenGz) {
  const xunShouGan = getXunShouGan(shichenGz);
  const zhiFuPos = Object.entries(diPan).find(([k,v])=>v===xunShouGan)?.[0] || 4;
  const zhiFuPosNum = parseInt(zhiFuPos);

  // Get hour gan position on earth plate
  const hourGan = shichenGz[0];
  let hourGanPos = 0;
  for(let k=1;k<=9;k++) { if(diPan[k]===hourGan){hourGanPos=k;break;} }

  const heavenPlate = getHeavenPlate(diPan, DUN, zhiFuPosNum, hourGanPos);
  const stars = getStars(heavenPlate, diPan);
  const gods = getGods(DUN, hourGanPos); // heaven value符落宫 = 时干宫

  // Doors from earth plate
  const doors = {};
  for(let p=1;p<=9;p++) {
    doors[p] = STEM_DOOR[diPan[p]] || '';
  }

  // Find which palace is 值符 (the heaven stem that equals xunShouGan on heaven plate)
  let heavenZfPos = hourGanPos; // 天盘值符落宫 = 时干宫

  return {
    shichenGz, xunShouGan, zhiFuPos: zhiFuPosNum,
    hourGanPos, heavenPlate, stars, doors, gods,
    heavenZfPos
  };
}

function renderCell(p, data) {
  const palaceName = PALACE_LABEL[p];
  return `
    <span class="cell-num">${p}·${palaceName}</span>
    <div class="cell-layer earth-stem">${diPan[p]||''}</div>
    <div class="cell-divider"></div>
    <div class="cell-layer heaven-stem">${data.heavenPlate[p]||''}</div>
    <div class="cell-layer door-text">${data.doors[p]||''}</div>
    <div class="cell-layer star-text">${data.stars[p]||''}</div>
    <div class="cell-layer god-text">${data.gods[p]||''}</div>
  `;
}

function renderGrid(data) {
  const container = document.getElementById('gridContainer');
  // Luoshu order: [4,9,2, 3,5,7, 8,1,6]
  const order = [4,9,2, 3,5,7, 8,1,6];
  let html = '';
  for(const p of order) {
    let cls = 'cell';
    if(p===5) cls += ' center-cell';
    if(p===data.zhiFuPos) cls += ' highlight-earth';
    if(p===data.heavenZfPos) cls += ' highlight-heaven';
    // Flash all heaven plate cells
    cls += ' flash';
    html += `<div class="${cls}">${renderCell(p, data)}</div>`;
  }
  container.innerHTML = html;
}

function updateInfo(data) {
  document.getElementById('infoShichen').textContent = data.shichenGz;
  document.getElementById('infoXunshou').textContent = data.xunShouGan + ' (' + PALACE_LABEL[data.zhiFuPos] + '宫)';
  document.getElementById('infoZhiFu').textContent = PALACE_LABEL[data.heavenZfPos] + '宫';
  document.getElementById('phraseHint').innerHTML =
    `<strong>${data.shichenGz}时</strong> — 旬首${data.xunShouGan}在${PALACE_LABEL[data.zhiFuPos]}宫 → 天盘值符飞到${PALACE_LABEL[data.heavenZfPos]}宫`;
}

function updateProgress() {
  const pct = ((currentIndex) / (SHICHEN_LIST.length - 1)) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  let labels = '';
  for(let i=0;i<SHICHEN_LIST.length;i++) {
    labels += `<span style="color:${i===currentIndex?'#f0d88a':'#5a4a30'}">${SHICHEN_LIST[i]}</span>`;
  }
  document.getElementById('progressLabels').innerHTML = labels;
}

function render(data) {
  renderGrid(data);
  updateInfo(data);
  updateProgress();
}

function stepTo(index) {
  currentIndex = ((index % SHICHEN_LIST.length) + SHICHEN_LIST.length) % SHICHEN_LIST.length;
  const data = computeAll(SHICHEN_LIST[currentIndex]);
  render(data);
}

function stepNext() { stepTo(currentIndex + 1); }
function stepPrev() { stepTo(currentIndex - 1); }
function jumpTo(idx) { stepTo(idx); }

function togglePlay() {
  if(isPlaying) {
    stopPlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  isPlaying = true;
  document.getElementById('btnPlay').textContent = '⏸ 暂停';
  document.getElementById('btnPlay').classList.add('active');
  scheduleNext();
}

function stopPlay() {
  isPlaying = false;
  document.getElementById('btnPlay').textContent = '▶ 播放';
  document.getElementById('btnPlay').classList.remove('active');
  if(playTimer) clearTimeout(playTimer);
}

function scheduleNext() {
  if(!isPlaying) return;
  const ms = 2200 - (speed * 200); // speed 1=2000ms, speed 10=200ms
  playTimer = setTimeout(() => {
    stepNext();
    scheduleNext();
  }, ms);
}

function updateSpeed() {
  speed = parseInt(document.getElementById('speedSlider').value);
  document.getElementById('speedLabel').textContent = speed;
  if(isPlaying) {
    if(playTimer) clearTimeout(playTimer);
    scheduleNext();
  }
}

function resetAll() {
  stopPlay();
  currentIndex = 0;
  const data = computeAll(SHICHEN_LIST[0]);
  render(data);
}

// keyboard controls
document.addEventListener('keydown', (e) => {
  if(e.key==='ArrowRight') stepNext();
  else if(e.key==='ArrowLeft') stepPrev();
  else if(e.key===' ') { e.preventDefault(); togglePlay(); }
  else if(e.key==='r') resetAll();
});

// ==================== INIT ====================

// Set initial info
document.getElementById('infoDun').textContent = '阳遁';
document.getElementById('infoBureau').textContent = BUREAU;
document.getElementById('infoJieqi').textContent = JIEQI;
document.getElementById('speedLabel').textContent = speed;
document.getElementById('speedSlider').value = speed;

// Start with first shichen
const initData = computeAll(SHICHEN_LIST[0]);
render(initData);

console.log('奇门遁甲动画已就绪');
console.log('操作：← → 切换时辰 | 空格 播放/暂停 | R 重置');
console.log(`阳遁${BUREAU}局 · ${JIEQI}`);
console.log('地盘：', diPan);
</script>

</body>
</html>
